apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-frontend
  annotations:
    argocd-image-updater.argoproj.io/image-list: frontend=yourdockerhubusername/ecommerce-frontend
    argocd-image-updater.argoproj.io/frontend.update-strategy: semver
    argocd-image-updater.argoproj.io/frontend.allow-tags: 'regexp:^v[0-9]+\.[0-9]+\.[0-9]+$'
    argocd-image-updater.argoproj.io/write-back-method: git
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-frontend
  template:
    metadata:
      labels:
        app: ecommerce-frontend
    spec:
      containers:
      - name: frontend
        image: yourdockerhubusername/ecommerce-frontend:v1.0.0
        ports:
        - containerPort: 80